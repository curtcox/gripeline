name: Publish to GitHub Pages

# Build the site (spec with rendered Graphviz diagrams + conformance test
# results) and deploy it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout curtcox/modl for parser cross-check
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: curtcox/modl
          path: .modl-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Verify browser dependencies
        run: python3 scripts/vendor.py

      - name: Build site
        run: MODL_REPO="${GITHUB_WORKSPACE}/.modl-repo" python3 site/build.py site/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  # Conformance tests, including the modl parity check (gripeline's modl
  # parser vs. modl's own, via tests/modl_parse.cjs). Separate from `build` so
  # a failure turns the run red without blocking the deploy: the published
  # site shows the failing results.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Checkout curtcox/modl for parser cross-check
        uses: actions/checkout@v4
        with:
          repository: curtcox/modl
          path: .modl-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Graphviz
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Run conformance tests
        run: MODL_REPO="${GITHUB_WORKSPACE}/.modl-repo" GRIPELINE='python3 gripeline.py' python3 tests/run.py

      - name: Run unit tests
        run: MODL_REPO="${GITHUB_WORKSPACE}/.modl-repo" python3 tests/test_units.py

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
